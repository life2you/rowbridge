name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，如 v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: 版本一致性校验
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          PKG_VER=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          CONF_VER=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "tag=$TAG  cargo=$CARGO_VER  package=$PKG_VER  tauri=$CONF_VER"
          for v in "$CARGO_VER" "$PKG_VER" "$CONF_VER"; do
            [ "$v" = "$VER" ] || { echo "::error::版本不一致：$v != $VER"; exit 1; }
          done

      - name: 测试
        run: cargo test -p rowbridge-core --all-targets

      # 发布的是原生的 GPUI 界面（crates/rowbridge-gpui），不再构建 Tauri/WebView 版本。
      - name: 构建原生应用
        run: ./scripts/bundle-gpui.sh --release

      - name: 生成 dmg
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ -n "${{ inputs.tag }}" ] && VER="${{ inputs.tag }}"
          VER="${VER#v}"
          APP=dist-gpui/RowBridge.app
          # bundle-gpui.sh 的版本取自 Cargo.toml，这里再核对一次，防止发错版本
          APP_VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          echo "app 版本：$APP_VER（期望 $VER）"
          [ "$APP_VER" = "$VER" ] || { echo "::error::app 版本与 tag 不一致"; exit 1; }
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist-release
          hdiutil create -volname "RowBridge" -srcfolder "$STAGE" -ov -format UDZO \
            "dist-release/RowBridge_${VER}_aarch64.dmg"
          rm -rf "$STAGE"
          shasum -a 256 dist-release/*.dmg | tee dist-release/SHA256SUMS

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: RowBridge ${{ inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            dist-release/*.dmg
            dist-release/SHA256SUMS
