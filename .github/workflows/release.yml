name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，如 v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 版本一致性校验
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          PKG_VER=$(node -p "require('./package.json').version")
          CONF_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=$TAG  cargo=$CARGO_VER  package=$PKG_VER  tauri=$CONF_VER"
          for v in "$CARGO_VER" "$PKG_VER" "$CONF_VER"; do
            [ "$v" = "$VER" ] || { echo "::error::版本不一致：$v != $VER"; exit 1; }
          done

      - name: 安装依赖
        run: npm ci

      - name: 测试
        run: cargo test -p rowbridge-core --all-targets

      - name: 构建应用
        run: npm run tauri build -- --no-bundle

      - name: 生成 dmg
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ -n "${{ inputs.tag }}" ] && VER="${{ inputs.tag }}"
          VER="${VER#v}"
          APP=target/release/bundle/macos/RowBridge.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/rowbridge "$APP/Contents/MacOS/rowbridge"
          cp src-tauri/icons/icon.icns "$APP/Contents/Resources/icon.icns"
          cp src-tauri/Info.plist "$APP/Contents/Info.plist" 2>/dev/null || true
          codesign --force --deep --sign - "$APP"
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist-release
          hdiutil create -volname "RowBridge" -srcfolder "$STAGE" -ov -format UDZO \
            "dist-release/RowBridge_${VER}_aarch64.dmg"
          rm -rf "$STAGE"
          shasum -a 256 dist-release/*.dmg | tee dist-release/SHA256SUMS

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: RowBridge ${{ inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            dist-release/*.dmg
            dist-release/SHA256SUMS
