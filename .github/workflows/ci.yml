name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: 单元测试
        run: cargo test -p rowbridge-core --lib

      # GitHub 的 macOS runner 没有 Docker，端到端测试跑不了。
      # 它在本地和自托管环境上跑：./tests/e2e/run.sh
      - name: 检查 e2e 脚本语法
        run: bash -n tests/e2e/run.sh

  build:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # 发布物是原生 GPUI 应用（crates/rowbridge-gpui），Tauri 版源码保留但不再构建。
      - name: 构建原生应用
        run: ./scripts/bundle-gpui.sh --release

      - name: 打包 zip
        run: ditto -c -k --keepParent dist-gpui/RowBridge.app dist-gpui/RowBridge.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RowBridge-app
          path: dist-gpui/RowBridge.zip
