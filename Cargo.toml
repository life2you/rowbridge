[workspace]
members = ["crates/rowbridge-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/life2you/rowbridge"

[workspace.dependencies]
mysql_async = { version = "0.37", default-features = false, features = [
    "minimal-rust",
    "default-rustls-ring",
] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
